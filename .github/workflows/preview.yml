# Preview for review (plan morning-digest § 3 and § 4, ADR 0003).
# Renders the digest page in CI and deploys it to GitHub Pages, so the HTML never enters git
# and the clean copy (marker off) can be uploaded over the same link.
name: preview

on:
  workflow_dispatch:
    inputs:
      marker:
        description: "Show the lane marker (on for review, off for the clean-up)"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save /digest/2026-10-28 as one HTML file
        env:
          LANE_MARKER: ${{ inputs.marker && secrets.LANE_MARKER || '' }}
        run: scripts/preview.sh /digest/2026-10-28 _site/index.html
      - name: Check the banner
        env:
          WANT_MARKER: ${{ inputs.marker }}
        run: |
          if [ "$WANT_MARKER" = "true" ]; then
            ! grep -q 'no marker set' _site/index.html || { echo "marker missing"; exit 1; }
          else
            grep -q 'no marker set' _site/index.html || { echo "marker still present"; exit 1; }
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@v4
